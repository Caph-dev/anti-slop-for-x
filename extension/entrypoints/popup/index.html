<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anti Slop for X</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1 id="title">Anti Slop for X</h1>
    <p class="sub" id="subtitle"></p>

    <dl class="meta">
      <div><dt id="lblEndpoint"></dt><dd id="endpoint">—</dd></div>
      <div><dt id="lblModel"></dt><dd id="model">—</dd></div>
      <div><dt id="lblMode"></dt><dd id="mode">—</dd></div>
      <div><dt id="lblScope"></dt><dd id="scope">—</dd></div>
      <div><dt id="lblStatus"></dt><dd id="status">—</dd></div>
    </dl>

    <div class="actions">
      <button id="scan" class="primary">Scan current page</button>
      <button id="settings">Options</button>
    </div>

    <p class="note" id="note"></p>

    <section class="log" id="log" hidden>
      <div class="log-head">
        <span id="lblLog"></span>
        <button id="clearLog" class="link"></button>
      </div>
      <ul id="logList"></ul>
      <p class="note" id="undoNote"></p>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
