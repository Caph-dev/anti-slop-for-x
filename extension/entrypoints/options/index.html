<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anti Slop for X</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1 data-i18n="optionsTitle">Anti Slop for X</h1>
        <p class="sub" data-i18n="optionsSubtitle">Fold AI-slop / bot replies on X</p>
      </header>

      <section class="card">
        <h2 data-i18n="sectionBehavior">Behavior</h2>
        <label class="row"><input type="checkbox" id="enabled" /> <span data-i18n="enabled">Enable</span></label>
        <label class="row"><input type="checkbox" id="autoScan" /> <span data-i18n="autoScan">Auto-scan</span></label>
        <label class="row"><input type="checkbox" id="prefilterOnly" /> <span data-i18n="prefilterOnly">Prefilter only (skip model)</span></label>
        <label class="row"><input type="checkbox" id="skipShortText" /> <span data-i18n="skipShortText">Skip short text</span></label>
        <label class="row"><input type="checkbox" id="skipOwnPosts" /> <span data-i18n="skipOwnPosts">Skip own posts</span></label>

        <label class="field">
          <span data-i18n="scanScope">Scan scope</span>
          <select id="scanScope">
            <option value="replies-only" data-i18n="scopeReplies">Replies only</option>
            <option value="timeline-and-replies" data-i18n="scopeAll">Timeline + replies</option>
          </select>
        </label>

        <label class="field">
          <span data-i18n="scanMode">Mode</span>
          <select id="scanMode">
            <option value="manual" data-i18n="modeManual">Manual — show the AI rate, you decide</option>
            <option value="auto-fold" data-i18n="modeFold">Auto fold — hide replies over the threshold</option>
          </select>
        </label>

        <label class="field">
          <span data-i18n="threshold">Fold threshold (<span id="thresholdVal">0.55</span>)</span>
          <input type="range" id="threshold" min="0.15" max="0.95" step="0.01" />
        </label>
      </section>

      <section class="card">
        <h2 data-i18n="sectionModel">Decision model</h2>
        <label class="field">
          <span data-i18n="endpointPreset">Endpoint</span>
          <select id="endpointPreset">
            <option value="jev-official" data-i18n="presetJev">TypeSafe / Jev (official)</option>
            <option value="openai-official" data-i18n="presetOpenAI">OpenAI Decisions (official)</option>
            <option value="custom" data-i18n="presetCustom">Custom endpoint</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="protocol">Protocol</span>
          <select id="protocol">
            <option value="jev">TypeSafe / Jev (noul/choice/score)</option>
            <option value="openai-decisions">OpenAI Decisions (predicate/choice/score)</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="upstreamBaseUrl">Upstream base URL</span>
          <input type="url" id="upstreamBaseUrl" placeholder="https://api.typesafe.ai/v1" />
        </label>
        <label class="field">
          <span data-i18n="upstreamPath">Decisions path (optional)</span>
          <input type="text" id="upstreamPath" placeholder="/systemone or /decisions" />
        </label>
        <label class="field">
          <span data-i18n="model">Model</span>
          <input type="text" id="model" placeholder="jev-latest" />
        </label>
        <label class="field">
          <span data-i18n="apiKey">Your own API key (stored in this browser only)</span>
          <input type="password" id="apiKey" autocomplete="off" />
        </label>
        <label class="field">
          <span data-i18n="defaultPrompt">Default prompt</span>
          <textarea id="defaultPrompt" rows="6"></textarea>
        </label>
      </section>

      <section class="card">
        <h2 data-i18n="sectionWhitelist">Account whitelist</h2>
        <label class="field">
          <span data-i18n="whitelistHelp">Handles (one per line, without @)</span>
          <textarea id="accountWhitelist" rows="4" placeholder="handle1&#10;handle2"></textarea>
        </label>
      </section>

      <footer class="actions">
        <button type="button" id="save" class="primary" data-i18n="save">Save</button>
        <button type="button" id="test" data-i18n="testProxy">Test proxy</button>
        <span id="status" role="status"></span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
