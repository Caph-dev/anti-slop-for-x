<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anti Slop for X</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1 data-i18n="optionsTitle">Anti Slop for X</h1>
        <p class="sub" data-i18n="optionsSubtitle">Mark possible low-quality posts on X with checkable evidence</p>
      </header>

      <section class="card">
        <h2 data-i18n="sectionBehavior">Behavior</h2>
        <label class="row"><input type="checkbox" id="enabled" /> <span data-i18n="enabled">Enable</span></label>
        <label class="row"><input type="checkbox" id="autoScan" /> <span data-i18n="autoScan">Auto-scan</span></label>
        <label class="row"><input type="checkbox" id="prefilterOnly" aria-describedby="prefilterOnlyHint" /> <span data-i18n="prefilterOnly">Model use off</span></label>
        <p class="hint" id="prefilterOnlyHint" data-i18n="prefilterOnlyHint"></p>
        <label class="row"><input type="checkbox" id="skipShortText" aria-describedby="skipShortTextHint" /> <span id="skipShortTextLabel">Don’t send short posts</span></label>
        <p class="hint" id="skipShortTextHint" data-i18n="skipShortTextHint"></p>
        <label class="row"><input type="checkbox" id="skipOwnPosts" /> <span data-i18n="skipOwnPosts">Don’t send or mark my own posts</span></label>

        <label class="field">
          <span data-i18n="scanScope">Scan scope</span>
          <select id="scanScope">
            <option value="replies-only" data-i18n="scopeReplies">Replies only</option>
            <option value="timeline-and-replies" data-i18n="scopeAll">Timeline + replies</option>
          </select>
        </label>

        <label class="field">
          <span data-i18n="scanMode">Mode</span>
          <select id="scanMode" aria-describedby="scanModeHint">
            <option value="manual" data-i18n="modeManual">Mark only</option>
            <option value="shadow" data-i18n="modeShadow">Record only</option>
          </select>
        </label>
        <p class="hint" id="scanModeHint" data-i18n="scanModeHint"></p>
      </section>

      <section class="card">
        <h2 data-i18n="sectionModel">Recognition model</h2>
        <p class="hint" data-i18n="modelIntro"></p>
        <label class="field">
          <span data-i18n="endpointPreset">Endpoint</span>
          <select id="endpointPreset" aria-describedby="endpointStatus">
            <option value="openai-responses" data-i18n="presetResponses">OpenAI Responses</option>
            <option value="jev-official" data-i18n="presetJev">TypeSafe / Jev (not supported)</option>
            <option value="openai-official" data-i18n="presetOpenAI">OpenAI Decisions (not supported)</option>
            <option value="custom" data-i18n="presetCustom">Custom endpoint</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="protocol">Protocol</span>
          <select id="protocol" aria-describedby="endpointStatus">
            <option value="openai-responses" data-i18n="protocolResponses">OpenAI Responses (structured output)</option>
            <option value="jev" data-i18n="protocolJev">TypeSafe / Jev (not supported)</option>
            <option value="openai-decisions" data-i18n="protocolDecisions">OpenAI Decisions (not supported)</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="upstreamBaseUrl">Base URL</span>
          <input type="url" id="upstreamBaseUrl" placeholder="https://api.openai.com/v1" />
        </label>
        <label class="field">
          <span data-i18n="upstreamPath">Path</span>
          <input type="text" id="upstreamPath" placeholder="/responses" />
        </label>
        <label class="field">
          <span data-i18n="model">Model</span>
          <input type="text" id="model" aria-describedby="modelHint" />
        </label>
        <p class="hint" id="modelHint" data-i18n="modelHint"></p>
        <label class="field">
          <span data-i18n="apiKey">Your own API key (stored in this browser only)</span>
          <input type="password" id="apiKey" autocomplete="off" />
        </label>
        <p class="hint status-line" id="endpointStatus" role="status" aria-live="polite"></p>
        <label class="field">
          <span data-i18n="defaultPrompt">Legacy prompt (kept, not sent)</span>
          <textarea id="defaultPrompt" rows="4" readonly aria-describedby="defaultPromptHint"></textarea>
        </label>
        <p class="hint" id="defaultPromptHint" data-i18n="defaultPromptHint"></p>
      </section>

      <section class="card">
        <h2 data-i18n="sectionRules">Your rules</h2>
        <p class="hint" data-i18n="rulesIntro"></p>
        <label class="field">
          <span data-i18n="whitelistHelp">Always keep: never mark, hide or send (one handle per line, without @)</span>
          <textarea id="accountWhitelist" rows="4" placeholder="handle1&#10;handle2"></textarea>
        </label>
        <label class="field">
          <span data-i18n="hideListHelp">Hide locally: fold in Mark only mode (one handle per line, without @)</span>
          <textarea id="accountHideList" rows="4" placeholder="handle1&#10;handle2" aria-describedby="hideListHint"></textarea>
        </label>
        <p class="hint" id="hideListHint" data-i18n="hideListHint"></p>
      </section>

      <footer class="actions">
        <button type="button" id="save" class="primary" data-i18n="save">Save</button>
        <button type="button" id="test" data-i18n="testProxy">Test connection</button>
        <span id="status" role="status" aria-live="polite"></span>
      </footer>
      <p class="hint" data-i18n="testHint"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
